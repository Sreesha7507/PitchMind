services:
  # ── Backend — FastAPI ────────────────────────────────────────────────────────
  - type: web
    name: pitchmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard — never committed
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend — React/Vite static site ───────────────────────────────────────
  - type: web
    name: pitchmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # After deploying the backend, set this to your backend's Render URL:
        # e.g. https://pitchmind-backend.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
